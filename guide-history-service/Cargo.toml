[package]
name = "guide-history-service"
version = "0.1.0"
description = "Standalone, always-on capture of Channels DVR guide data before it ages out of the server's forward-only EPG window — serves a rolling JSON history over HTTP so any number of DVRDesk clients can show 'what was on yesterday' without any one of them needing to stay running."
edition = "2021"

[[bin]]
name = "guide-history-service"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
chrono = "0.4"

[profile.dev]
opt-level = 1
