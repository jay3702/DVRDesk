# Builds and drafts a release for DVRDesk Native (native/) and its
# guide-history-service companion — a separate pipeline from release.yml
# (which builds the Tauri app on `v*` tags), triggered on a distinct
# `native-v*` tag prefix so the two release trains never collide.
#
# Deliberately narrower than a "real" cross-platform release for v1:
# - Linux and Windows, each x86_64 and arm64 (no macOS). The arm64 builds
#   are allowed to fail without blocking the draft, as in release.yml —
#   check the draft has all their assets before publishing.
# - Linux ships a real .deb with a `libmpv2` runtime dependency declared,
#   plus an AppImage for other distros (native/packaging/linux/
#   build-appimage.sh) that also uses the system's libmpv — libmpv is
#   dlopen'd at runtime (see native/src/player/mpv_sys.rs), never linked at
#   compile time, confirmed via `ldd` that nothing but libc is actually
#   linked, so no build-time system packages are needed at all.
# - Windows arm64 is cross-compiled on the x64 runner with clang-cl, which
#   ring (via rustls) needs for that target — the same setup release.yml
#   uses. The in-app mpv download fetches shinchiro's aarch64 build there.
# - Windows: mpv/libmpv is NOT bundled. An earlier version of this workflow
#   downloaded a prebuilt libmpv-2.dll from the SourceForge mpv-player-windows
#   project (built by shinchiro/mpv-winbuild-cmake) — checked that build's own
#   packages/ffmpeg.cmake directly and confirmed it's configured with
#   `--enable-gpl --enable-version3`, and mpv.cmake sets no LGPL override
#   either, so that specific build is GPL-licensed. Redistributing it inside
#   this app's own shipped .zip would put the whole distributed bundle under
#   GPL obligations, which isn't a decision to make silently by picking a
#   convenient download URL. Instead the app offers to download libmpv from
#   that same publisher on first run (native/src/mpv_install.rs), so the
#   user fetches it rather than this release redistributing it. The winget
#   mpv package is no substitute: it contains mpv.exe but no libmpv DLL. Building mpv/FFmpeg
#   from source under controlled LGPL flags, the way Clicker
#   (github.com/mackid1993/Clicker, this rewrite's own inspiration) does for
#   its own releases, would let this app bundle libmpv directly again — a
#   real, substantial follow-up, not attempted this pass.
# - No code signing/notarization, no installer (NSIS/WiX) — Windows ships as
#   a portable .zip.
# - Always drafts the release rather than publishing it automatically
#   (mirrors Clicker's own release.yml design) — a human reviews and clicks
#   publish once every platform's asset is actually in hand.
#
# The Windows job as a whole is untested against a real windows-latest
# runner as of when this was written (this dev environment has no way to
# run one) — the first real tag push is the actual verification for it,
# same as it is for the exact Linux runtime dependency list.

name: Native Release

on:
  push:
    tags:
      - "native-v*"

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            allow_failure: false
          - runner: ubuntu-22.04-arm
            arch: aarch64
            allow_failure: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
            guide-history-service/target
          key: native-linux-${{ matrix.arch }}-cargo-${{ hashFiles('native/Cargo.lock', 'guide-history-service/Cargo.lock') }}

      - uses: taiki-e/install-action@cargo-deb

      - name: Build dvrdesk-native
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Build guide-history-service
        run: cargo build --release --manifest-path guide-history-service/Cargo.toml

      - name: Package .deb
        run: cargo deb --no-build --manifest-path native/Cargo.toml

      - name: Package AppImage
        run: native/packaging/linux/build-appimage.sh dist

      - name: Package guide-history-service
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C guide-history-service/target/release -czf \
            dist/guide-history-service-linux-${{ matrix.arch }}.tar.gz guide-history-service

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native/target/debian/*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.arch }})
    runs-on: windows-latest
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            allow_failure: false
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            allow_failure: true
    env:
      CC_aarch64_pc_windows_msvc: clang-cl
      CXX_aarch64_pc_windows_msvc: clang-cl
      AR_aarch64_pc_windows_msvc: llvm-lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
            guide-history-service/target
          key: native-windows-${{ matrix.arch }}-cargo-${{ hashFiles('native/Cargo.lock', 'guide-history-service/Cargo.lock') }}

      - name: Install LLVM (arm64 cross-compile)
        if: matrix.arch == 'aarch64'
        run: choco install llvm --no-progress -y

      - name: Build dvrdesk-native
        run: cargo build --release --target ${{ matrix.target }} --manifest-path native/Cargo.toml

      - name: Build guide-history-service
        run: cargo build --release --target ${{ matrix.target }} --manifest-path guide-history-service/Cargo.toml

      # mpv/libmpv is deliberately NOT bundled here — see this file's header
      # comment for why. The zip's README (native/packaging/windows/) covers
      # the in-app mpv download and setting up the Guide History service.
      - name: Package dvrdesk-native
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # guide-history-service.exe rides along so Settings can install it
          # on this PC (native/src/deploy.rs looks for it next to the app).
          Compress-Archive -Path native/target/${{ matrix.target }}/release/dvrdesk-native.exe, native/packaging/windows/README-Windows.txt, guide-history-service/target/${{ matrix.target }}/release/guide-history-service.exe `
            -DestinationPath dist/DVRDesk-Native-Windows-${{ matrix.arch }}.zip -Force

      - name: Package guide-history-service
        shell: pwsh
        run: |
          Compress-Archive -Path guide-history-service/target/${{ matrix.target }}/release/guide-history-service.exe `
            -DestinationPath dist/guide-history-service-windows-${{ matrix.arch }}.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#native-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la staging/
          TITLE="DVRDesk Native ${VERSION}"
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Created *without* --draft on purpose, then immediately
            # flipped to draft — confirmed the hard way (native-v2.0.1's
            # own first real run) that `gh release create --draft
            # <existing-tag>` never actually binds to that tag: GitHub
            # gives every draft an `untagged-<hash>` placeholder identity
            # regardless, only resolving the real tag at publish time.
            # This is a documented, still-open GitHub CLI/API behavior
            # (cli/cli#11589), not something this workflow was doing
            # wrong — the API request correctly carries `tag_name` and
            # still comes back untagged. Creating it published (which
            # binds to the tag immediately) and then editing it back to
            # draft is the only way to get a real, correctly tag-bound
            # release object. This does mean the release is briefly live
            # and public for the few seconds between these two commands —
            # a real, deliberate tradeoff, not an oversight, and the
            # reason this two-step dance exists instead of a single
            # `--draft` create.
            #
            # --latest=false: installed 1.x clients (v1.14.x and older)
            # only check GitHub's repo-wide /releases/latest, and can't
            # parse a native-v* tag, so a native release marked Latest
            # silently switches their update banner off. Keep a v* release
            # as Latest. Leave "Set as the latest release" unticked when
            # publishing this draft too.
            gh release create "${GITHUB_REF_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "Built from ${GITHUB_SHA}." \
              --latest=false
            gh release edit "${GITHUB_REF_NAME}" --draft --latest=false
          fi
          gh release upload "${GITHUB_REF_NAME}" staging/* --clobber
