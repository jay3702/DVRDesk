[package]
name = "dvrdesk-native"
version = "2.2.0"
description = "DVRDesk native (Rust + egui + libmpv) — Channels DVR desktop client"
edition = "2021"

[[bin]]
name = "dvrdesk-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = { version = "0.29", features = ["serde"] }
egui_glow = "0.29"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "fs", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = "0.4"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
quick-xml = "0.36"
rusqlite = { version = "0.40", features = ["bundled"] }
# PowerShell -EncodedCommand for the Windows history-service install (deploy.rs).
base64 = "0.22"

# Reads the old Tauri app's WebView2 localStorage for the settings import
# (`src/migration.rs`). Windows only — Linux reads WebKitGTK's SQLite instead.
[target.'cfg(windows)'.dependencies]
rusty-leveldb = "4.0.1"
# Downloading libmpv on first run (`src/mpv_install.rs`): the mpv-dev
# archive is 7z with a BCJ2 filter, which sevenz-rust2 handles.
sevenz-rust2 = "0.23"
sha2 = "0.10"

# Embeds the .exe's own icon (Explorer, taskbar pinning, Alt-Tab) — see
# build.rs. Build scripts compile for the host, and the Windows release job
# builds on Windows, so this is never fetched for Linux builds.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

# `cargo deb` packaging — see .github/workflows/native-release.yml for how
# this gets built and shipped. `depends` is the one runtime library this app
# actually needs from the system: libmpv is loaded dynamically (`libloading`,
# see `src/player/mpv_sys.rs`), never linked at compile time, so this is the
# only entry that needs to be here — X11/Wayland/GL are loaded the same
# dynamic way by `winit` and are already present on any real Linux desktop,
# confirmed via `ldd` on a real build showing nothing beyond libc linked.
[package.metadata.deb]
maintainer = "Jay Ward <jay@thewards.net>"
copyright = "2026, Jay Ward"
extended-description = "A native Rust/egui/libmpv desktop client for Channels DVR."
depends = "libmpv2"
section = "video"
priority = "optional"
assets = [
    ["target/release/dvrdesk-native", "usr/bin/", "755"],
    # Bundled so Settings can install the guide history service on this PC
    # without building it (see src/deploy.rs). CI builds it before packaging.
    ["../guide-history-service/target/release/guide-history-service", "usr/lib/dvrdesk-native/", "755"],
    ["packaging/linux/dvrdesk-native.desktop", "usr/share/applications/", "644"],
    ["../src-tauri/icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/dvrdesk-native.png", "644"],
]
