[package]
name = "dvrdesk-native"
version = "2.0.0"
description = "DVRDesk native (Rust + egui + libmpv) — Channels DVR desktop client"
edition = "2021"

[[bin]]
name = "dvrdesk-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = { version = "0.29", features = ["serde"] }
egui_glow = "0.29"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "fs", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = "0.4"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
quick-xml = "0.36"

[profile.dev]
opt-level = 1
